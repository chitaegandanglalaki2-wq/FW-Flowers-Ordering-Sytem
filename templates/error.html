<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% if code == 404 %}Page not found{% elif code == 403 %}Access denied{% else %}Something went wrong{% endif %} | FuzzyWire Bouquet</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
<main class="container">
  <section class="error-page">
    <div class="error-page-card panel">
      <span class="error-page-code" aria-hidden="true">{{ code }}</span>
      <p class="eyebrow mb-2">FUZZYWIRE BOUQUET</p>
      <h1 class="h3 fw-bold">
        {% if code == 404 %}We can’t find that page{% elif code == 403 %}This page is off limits{% else %}Something went wrong{% endif %}
      </h1>
      <p class="text-secondary">{{ message }}</p>
      <a class="btn btn-pink" href="{{ url_for('home') }}">Back to Home</a>
    </div>
  </section>
</main>
</body>
</html>
